name: Question suggestion
description: Suggest a sourced Singapore trivia question
title: "Question: "
labels: [question-suggestion]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Keep it concise enough for the host to read aloud.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Four answer options
      placeholder: |
        A.
        B.
        C.
        D.
    validations:
      required: true
  - type: input
    id: answer
    attributes:
      label: Correct answer
    validations:
      required: true
  - type: textarea
    id: explanation
    attributes:
      label: Explanation
      description: One or two entertaining, factual sentences.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Reliable source URL
    validations:
      required: true
